
<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <h2>🌦 Weather App</h2>

        <div>
            <button onclick="goToLogin()">Login</button>
            <button onclick="goToSignup()">Signup</button>
        </div>
    </nav>

    <section class="hero">
        <h1>Weather Information App</h1>

        <p>
            Get weather information including temperature,
            humidity, wind speed and forecast.
        </p>

        <button class="main-btn" onclick="goToLogin()">
            Get Started
        </button>
    </section>

    <section class="features">

        <div class="feature-card">
            <h3>🌡 Temperature</h3>
            <p>View current temperature.</p>
        </div>

        <div class="feature-card">
            <h3>💧 Humidity</h3>
            <p>Check humidity information.</p>
        </div>

        <div class="feature-card">
            <h3>💨 Wind Speed</h3>
            <p>View current wind speed.</p>
        </div>

        <div class="feature-card">
            <h3>📅 Forecast</h3>
            <p>View upcoming weather forecast.</p>
        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
